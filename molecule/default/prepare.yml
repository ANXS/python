---
- name: Prepare
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 86400
      when: ansible_facts['os_family'] == "Debian"

    - name: Install essential packages
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
          - gnupg
          - |
            {{ 'software-properties-common' if (ansible_facts['distribution'] != 'Debian'
            or (ansible_facts['distribution'] == 'Debian'
            and (ansible_facts['distribution_major_version'] | int) < 13)) else omit }}
          - "lsb-release"
        state: present
        update_cache: true
      when: ansible_facts['os_family'] == "Debian"

    - name: Create test user for permission tests
      ansible.builtin.user:
        name: testuser
        shell: /bin/bash
        create_home: true
        state: present

    - name: Ensure target directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /opt/python
        - /opt/python/bin
        - /tmp/test-downloads
